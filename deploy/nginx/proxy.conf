# header + timeout ที่ทุก location ของ /api/ ใช้ร่วมกัน (include จาก luma.conf)

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# backend เห็น IP จริงของผู้ใช้ ไม่ใช่ IP ของ Nginx — rate limit ฝั่ง Flask จึงยังนับถูกตัว
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# generate เรียก Forge ซึ่งใช้เวลานาน — backend ตั้ง FORGE_TIMEOUT_SECONDS ไว้ 120 วินาที
# ตรงนี้ต้องมากกว่านั้น ไม่งั้น Nginx ตัดก่อนแล้วผู้ใช้เห็น 504 ทั้งที่ภาพกำลังจะเสร็จ
proxy_connect_timeout  10s;
proxy_send_timeout     180s;
proxy_read_timeout     180s;

# ภาพที่ตอบกลับมาเป็นไฟล์ PNG ส่งตรงให้ browser ไม่ต้องรอบัฟเฟอร์ทั้งก้อน
proxy_buffering off;
