# LUMA — Nginx reverse proxy (V5, issue #30)
#
#   browser ──► Nginx :8080 ─┬─ /       → ไฟล์ static ใน services/frontend/
#                            └─ /api/   → backend Flask :5000 → ai-engine :8000 → Forge :7860
#
# ผู้ใช้เห็น origin เดียว cookie กับ CSRF จึงทำงานเหมือนตอนรัน Flask ตัวเดียว
#
# ⚠️ ไฟล์นี้เป็น "แม่แบบ" — ห้ามใส่ path หรือ IP ของเครื่องใครลงไป
#    สร้างไฟล์ของเครื่องตัวเองด้วยคำสั่งใน deploy/nginx/README.md
#    (แทน __FRONTEND_DIR__ · __BACKEND__ · __THIS_DIR__ · __NGINX_CONF_DIR__)
#    ไฟล์ผลลัพธ์ชื่อ luma.local.conf ซึ่ง .gitignore กันไว้แล้ว

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # path ของ include เทียบกับ "ที่อยู่ของไฟล์ config" ไม่ใช่โฟลเดอร์ Nginx จึงต้องระบุเต็ม
    # ใส่ " ครอบทุก path เผื่อชื่อโฟลเดอร์มีช่องว่าง (เช่น D:/Image Processing/...)
    include       "__NGINX_CONF_DIR__/mime.types";
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # อัปโหลดภาพของ /api/img2img ส่งเป็น base64 (เพดานฝั่ง backend 10 MB)
    # base64 ทำให้ใหญ่ขึ้น ~33% + JSON อื่นๆ จึงเผื่อเป็น 20m
    # ถ้าน้อยกว่านี้ Nginx จะตอบ 413 เองโดย backend ไม่เห็น request เลย
    client_max_body_size 20m;

    # MUST ของ #30: ย้ายตัวนับ rate limit ออกจากหน่วยความจำของ Flask
    # ตัวนับของ Flask (auth.py) อยู่ใน process เดียว รันหลาย worker แล้วนับแยกกัน
    # ตัวนับของ Nginx อยู่ใน shared memory zone ใช้ร่วมกันทุก worker ของ Nginx
    # นับตาม IP (Nginx ไม่เห็น body จึงไม่รู้ว่าอีเมลอะไร) — ทำงานคู่กับตัวนับต่อบัญชีใน backend (#15 F14)
    limit_req_zone $binary_remote_addr zone=luma_login:10m rate=30r/m;
    limit_req_status 429;

    upstream luma_backend {
        server __BACKEND__;    # เครื่องเดียว: 127.0.0.1:5000 · ข้ามเครื่อง: 192.168.1.20:5000
    }

    server {
        listen      8080;      # พอร์ต 80 มักถูกใช้อยู่แล้วบน Windows
        server_name localhost;

        access_log  logs/luma.access.log;
        error_log   logs/luma.error.log;

        root "__FRONTEND_DIR__";   # โฟลเดอร์ services/frontend/ (Nginx เสิร์ฟ static เอง ไม่ผ่าน Flask)

        # หน้าแรกเหมือนที่ Flask ทำ (`/` → /pages/index.html)
        location = / {
            return 302 /pages/index.html;
        }

        # ไฟล์ static (css / js / partials / รูป) — Nginx เสิร์ฟเอง ไม่รบกวน Flask
        location / {
            try_files $uri $uri/ =404;
        }

        # หน้า HTML ต้องผ่าน Flask เพราะ cookie csrf_token ถูกตั้งใน after_request ของ Flask
        # ถ้าให้ Nginx เสิร์ฟ .html เอง การเปิดหน้าเว็บจะไม่แตะ Flask เลย -> ไม่มี csrf_token
        # -> หน้า login / register (ซึ่งไม่เรียก /api/ ก่อนกดปุ่ม) จะส่งฟอร์มแล้วได้ 400
        # (ทดสอบจริงผ่าน Nginx แล้วเจอเคสนี้ตอนทำ #30)
        location ~ \.html$ {
            include   "__THIS_DIR__/proxy.conf";
            proxy_pass http://luma_backend;
        }

        # จำกัดจำนวนครั้งเฉพาะหน้า login — ต้องอยู่ก่อน /api/ (exact match ชนะ prefix)
        location = /api/auth/login {
            limit_req zone=luma_login burst=10 nodelay;
            include   "__THIS_DIR__/proxy.conf";
            proxy_pass http://luma_backend;
        }

        location /api/ {
            include   "__THIS_DIR__/proxy.conf";
            proxy_pass http://luma_backend;
        }
    }
}
